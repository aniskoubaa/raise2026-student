# RAISE 2026 — GPU override.
# Use:  docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
# install_docker.sh stacks it automatically when RAISE_HW_TIER ∈ {GPU_LOW, GPU_HIGH}.
#
# Requires nvidia-container-toolkit on the host.

services:
  raise2026:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      GZ_RENDER_ENGINE: ogre2
